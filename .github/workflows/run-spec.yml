name: Run Spec

on:
  workflow_dispatch:
    inputs:
      spec_file:
        description: 'Spec file or directory to run (default: tests/ = whole suite)'
        required: false
        default: 'tests/'
      branch:
        description: 'Branch to run against'
        required: false
        default: 'main'
      grep:
        description: 'Optional grep filter for individual journey'
        required: false
        default: ''
      correlation_id:
        description: 'Client-generated id to correlate this dispatch to its run (blank for manual dispatch)'
        required: false
        default: ''

run-name: "Run Spec — ${{ inputs.spec_file }}${{ inputs.grep != '' && format(' [{0}]', inputs.grep) || '' }}${{ inputs.correlation_id != '' && format(' #{0}', inputs.correlation_id) || '' }}"

jobs:
  run-spec:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # a failing shard must not cancel the others
      matrix:
        shard: [1, 2, 3, 4, 5, 6]   # 6 shards; strategy.job-total keeps --shard N in sync
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble

    steps:
      - name: Install git-lfs
        # git-lfs from the official GitHub release (pinned version, SHA-256 checked against the release's
        # sha256sums.asc), not Ubuntu apt. The Playwright container image does not ship git-lfs, and the old
        # apt-get install depended on archive.ubuntu.com, whose DNS failed from these runners on 2026-11-11 and
        # broke every CI job at this step for hours. Skips the download if git-lfs is already present.
        run: |
          if git lfs version >/dev/null 2>&1; then git lfs version; exit 0; fi
          v=3.6.1
          sha=2138d2e405a12f1a088272e06790b76699b79cb90d0317b77aafaf35de908d76
          curl -fsSL --retry 3 -o /tmp/git-lfs.tgz "https://github.com/git-lfs/git-lfs/releases/download/v${v}/git-lfs-linux-amd64-v${v}.tar.gz"
          echo "${sha}  /tmp/git-lfs.tgz" | sha256sum -c -
          tar -xzf /tmp/git-lfs.tgz -C /tmp
          /tmp/git-lfs-${v}/install.sh
          git lfs version

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install dependencies
        run: npm ci

      - name: Run Playwright spec (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        env:
          HOME: /root
          # Exclude the shared-E2E-account specs from the sharded matrix — they run in the dedicated
          # unsharded `run-shared-auth` job below (parallel shards clobber the shared login session).
          SKIP_SHARED_AUTH_SPECS: '1'
        run: npx playwright test "${{ inputs.spec_file }}"${{ inputs.grep != '' && format(' --grep "{0}"', inputs.grep) || '' }}${{ inputs.grep == '@regression' && ' --retries=2' || '' }} --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=blob,line

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

  # Shared-E2E-account specs (profile, tournaments, auth, ktag-udc) run here — ONE unsharded
  # container, workers=1 — so only one process ever signs into the shared account at a time. Running
  # them split across the parallel shard matrix invalidated each other's session ("session was lost —
  # marketing gate shown"). Scoped to whatever shared-account specs fall under the dispatched
  # spec_file; a dispatch with none in scope (e.g. betting-sites) runs nothing here.
  run-shared-auth:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble

    steps:
      - name: Install git-lfs
        # git-lfs from the official GitHub release (pinned version, SHA-256 checked against the release's
        # sha256sums.asc), not Ubuntu apt. The Playwright container image does not ship git-lfs, and the old
        # apt-get install depended on archive.ubuntu.com, whose DNS failed from these runners on 2026-11-11 and
        # broke every CI job at this step for hours. Skips the download if git-lfs is already present.
        run: |
          if git lfs version >/dev/null 2>&1; then git lfs version; exit 0; fi
          v=3.6.1
          sha=2138d2e405a12f1a088272e06790b76699b79cb90d0317b77aafaf35de908d76
          curl -fsSL --retry 3 -o /tmp/git-lfs.tgz "https://github.com/git-lfs/git-lfs/releases/download/v${v}/git-lfs-linux-amd64-v${v}.tar.gz"
          echo "${sha}  /tmp/git-lfs.tgz" | sha256sum -c -
          tar -xzf /tmp/git-lfs.tgz -C /tmp
          /tmp/git-lfs-${v}/install.sh
          git lfs version

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install dependencies
        run: npm ci

      - name: Run shared-account specs (unsharded, single worker)
        env:
          HOME: /root
        run: |
          SPEC='${{ inputs.spec_file }}'
          AUTH_SPECS="tests/profile.spec.ts tests/tournaments.spec.ts tests/auth.spec.ts tests/ktag/ktag-udc.spec.ts"
          TARGETS=""
          for a in $AUTH_SPECS; do
            case "$a" in "$SPEC"*) TARGETS="$TARGETS $a" ;; esac
          done
          mkdir -p blob-report
          if [ -z "$TARGETS" ]; then
            echo "No shared-account specs in scope for '$SPEC' — nothing to run here."
            exit 0
          fi
          echo "Running shared-account specs unsharded (workers=1):$TARGETS"
          npx playwright test$TARGETS${{ inputs.grep != '' && format(' --grep "{0}"', inputs.grep) || '' }}${{ inputs.grep == '@regression' && ' --retries=2' || '' }} --workers=1 --reporter=blob,line

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-auth
          path: blob-report/
          retention-days: 1
          if-no-files-found: ignore

  merge-report:
    needs: [run-spec, run-shared-auth]
    if: always()                # merge even when some shards/jobs failed
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Download all shard blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge into single JSON + HTML report
        env:
          HOME: /root
        run: |
          mkdir -p test-results
          npx playwright merge-reports --reporter json ./all-blob-reports > test-results/results.json
          npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Collect failure screenshots (slim, content-addressed)
        run: |
          mkdir -p failure-screenshots
          node -e '
            const fs = require("fs"), path = require("path");
            const d = JSON.parse(fs.readFileSync("test-results/results.json", "utf8"));
            const shas = new Set();
            (function walk(su) {
              (su.specs || []).forEach(sp => (sp.tests || []).forEach(t => (t.results || []).forEach(r => (r.attachments || []).forEach(a => {
                if (a.name === "screenshot" && a.path && a.path.endsWith(".png")) shas.add(path.basename(a.path));
              }))));
              (su.suites || []).forEach(walk);
            })({ suites: d.suites || [] });
            let n = 0;
            for (const s of shas) {
              const src = path.join("all-blob-reports", "resources", s);
              if (fs.existsSync(src)) { fs.copyFileSync(src, path.join("failure-screenshots", s)); n++; }
            }
            console.log("collected " + n + "/" + shas.size + " failure screenshot(s)");
          '

      - name: Upload merged JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-json          # same name the dashboard already downloads
          path: test-results/results.json
          retention-days: 30

      - name: Upload merged HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-spec-report            # same name; now the (trimmed) merged HTML report
          path: playwright-report/
          retention-days: 30

      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots        # slim, content-addressed <sha>.png — what the dashboard ingests
          path: failure-screenshots/
          retention-days: 30
