name: Baseline Refresh

on:
  schedule:
    # GitHub Actions cron is UTC-only (no DST). 03:00 UTC = 03:00 Ireland in winter /
    # 04:00 IST in summer. Dashboard "Run Tests → Schedule" times use Europe/Dublin and
    # stay on Ireland wall-clock across DST — prefer that for anything that must stay put.
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  baseline-refresh:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Install git-lfs
        # git-lfs from the official GitHub release (pinned version, SHA-256 checked against the release's
        # sha256sums.asc), not Ubuntu apt. The Playwright container image does not ship git-lfs, and the old
        # apt-get install depended on archive.ubuntu.com, whose DNS failed from these runners on 2026-11-11 and
        # broke every CI job at this step for hours. Skips the download if git-lfs is already present.
        run: |
          if git lfs version >/dev/null 2>&1; then git lfs version; exit 0; fi
          v=3.6.1
          sha=2138d2e405a12f1a088272e06790b76699b79cb90d0317b77aafaf35de908d76
          curl -fsSL --retry 3 -o /tmp/git-lfs.tgz "https://github.com/git-lfs/git-lfs/releases/download/v${v}/git-lfs-linux-amd64-v${v}.tar.gz"
          echo "${sha}  /tmp/git-lfs.tgz" | sha256sum -c -
          tar -xzf /tmp/git-lfs.tgz -C /tmp
          /tmp/git-lfs-${v}/install.sh
          git lfs version

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install dependencies
        run: npm ci

      - name: Compute refresh date
        id: date
        run: echo "iso=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Refresh baselines
        continue-on-error: true
        run: npx playwright test --project=visual-chromium-desktop --project=visual-chromium-android --project=visual-webkit-desktop --project=visual-webkit-ios --update-snapshots

      - name: Close stale baseline-refresh PRs
        run: |
          gh pr list --label baseline-refresh --state open --json number --jq '.[].number' | xargs -I{} gh pr close {} --comment "Superseded by run ${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: auto/baseline-refresh-${{ github.run_id }}
          commit-message: 'chore: weekly baseline refresh'
          title: 'Weekly baseline refresh — ${{ steps.date.outputs.iso }}'
          body: |
            Automated weekly baseline refresh produced by `.github/workflows/baseline-refresh.yml`.

            **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ## What this is

            The visual regression baselines for all 4 projects (chromium-desktop, chromium-android, webkit-desktop, webkit-ios) have been re-captured against the current live site. This runs weekly so baselines don't accumulate drift between feature PRs.

            ## How to review

            - Inspect the snapshot diffs in the **Files changed** tab. Each refreshed baseline replaces the prior committed PNG.
            - Most diffs should be benign content drift (operator rotation, copy updates, promotional banners).
            - **An unexpectedly large diff on a stable region** (header, footer, navigation, grid structure) may indicate a real layout regression — investigate before merging.
            - If the workflow run above shows tests still failing after `--update-snapshots`, that means the page itself failed to load or the test threw — re-run the workflow or refresh those baselines manually.

            ## Notes

            - `continue-on-error: true` is set on the test step, so this PR opens even if some baselines could not be captured.
            - Generated by `peter-evans/create-pull-request@v6` using the default `GITHUB_TOKEN`. CI will **not** run automatically on this PR — close and re-open, or push an empty commit, to trigger checks if you need verification before merge.
          labels: |
            baseline-refresh
            automated
          reviewers: mcgras22
