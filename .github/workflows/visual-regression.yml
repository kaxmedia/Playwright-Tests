name: Visual Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_baselines:
        description: 'Capture new baselines and upload as artifact'
        type: boolean
        default: false
      correlation_id:
        description: 'Client-generated id to correlate this dispatch to its run (blank for manual dispatch)'
        required: false
        default: ''
      grep:
        description: 'Only run tests whose title matches this string/regex (blank = run all). Passed to Playwright --grep.'
        required: false
        default: ''

run-name: "Visual Regression${{ inputs.correlation_id != '' && format(' #{0}', inputs.correlation_id) || '' }}"

# Auto-cancel superseded runs on the same ref so pushes/reopens don't leave
# long (~78 min) visual runs stacking up and competing for runners.
concurrency:
  group: visual-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble

    # Normalize update_baselines to a single boolean-string, computed ONCE.
    # workflow_dispatch inputs arrive as STRINGS over the REST API (how the dashboard
    # dispatches), and in GitHub Actions expressions ANY non-empty string is truthy — so the
    # literal string "false" evaluated as truthy and a naive `${{ inputs.update_baselines }}`
    # ALWAYS captured baselines instead of comparing. Compare explicitly against both the
    # string and boolean forms (and empty, on push/PR) so only a real "true" triggers capture.
    env:
      CAPTURE_BASELINES: ${{ inputs.update_baselines == 'true' || inputs.update_baselines == true }}

    steps:
      - name: Install git-lfs
        run: apt-get update && apt-get install -y git-lfs

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install dependencies
        run: npm ci

      - name: Run visual regression tests
        env:
          # Emit a machine-readable JSON report alongside the HTML one so the dashboard can
          # ingest per-page/project pass/fail + diff-image attachment paths. The diff PNGs
          # themselves live under test-results/ (uploaded by the failure step below).
          PLAYWRIGHT_JSON_OUTPUT_NAME: visual-results.json
          # Optional title filter (workflow_dispatch `grep` input). Empty on push/PR and on
          # dispatches that omit it, so ${GREP:+…} expands to nothing → full suite as before.
          # Passed via env (not inlined) so the value is shell-quoted, not command-injected.
          GREP: ${{ inputs.grep }}
        run: npx playwright test --project=visual-chromium-desktop --project=visual-chromium-android --project=visual-webkit-desktop --project=visual-webkit-ios --reporter=html,json ${{ env.CAPTURE_BASELINES == 'true' && '--update-snapshots' || '' }} ${GREP:+--grep "$GREP"}

      # Publish the JSON report on every comparison run (pass or fail) so the dashboard has
      # per-page status each time — not only on failure. Skipped for baseline-capture runs
      # (update_baselines), which don't compare. `always()` so a failing run still uploads it.
      - name: Upload visual results JSON
        if: ${{ always() && env.CAPTURE_BASELINES != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-results-json
          path: visual-results.json
          retention-days: 30
          if-no-files-found: warn

      - name: Upload baselines
        if: ${{ always() && env.CAPTURE_BASELINES == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: tests/visual/**-snapshots/
          retention-days: 30

      - name: Upload report and results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30

      # Small, dedicated artifact of ONLY the per-test comparison PNGs Playwright writes under
      # test-results/ on a failed toHaveScreenshot — verified against a real failing run:
      # test-results/<test-dir>/<snapshot>-actual.png (and <snapshot>-diff.png on a same-size
      # pixel diff). Scoped to those two so it stays small/fast (excludes the generic
      # test-failed-N.png page screenshots and the ~600MB visual-regression-report bundle above),
      # for the dashboard's visual-diff viewer to ingest.
      - name: Upload visual failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-failure-screenshots
          path: |
            test-results/**/*-diff.png
            test-results/**/*-actual.png
          retention-days: 30
          if-no-files-found: warn
